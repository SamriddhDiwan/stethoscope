<head>
    <title>PCM Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href='http://fonts.googleapis.com/css?family=Roboto' rel='stylesheet' type='text/css'>
    <link rel="icon" href="image/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/darkmode-js@1.5.7/lib/darkmode-js.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js" charset="utf-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/pcm-player@0.0.18/dist/index.js"></script>
    <script type="js/worker.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
</head>
<style>
    body {
        font-family: 'Roboto', sans-serif;
    }

    .button {
        border: none;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
    }

    #bpmDisplay {
        font-size: 2em;
        font-weight: bold;
        margin: 10px 0;
        padding: 10px;
        text-align: center;
        background-color: #f0f0f0;
        border-radius: 5px;
    }
</style>

<body>
    <h1>Stethoscope Client</h1>
    <p>Connect to WebSocket by pressing the [Connect] button first!</p>
    <button id="connectBtn" class="button" onclick="connect()">Connect</button>
    <input type="range" max="200" value="1" min="0" id="range" onchange="changeVolume(event)" step="0.1">
    <button id="pauseBtn" class="button" onclick="pause()">Pause Playing</button>
    <button id="continueBtn" class="button" onclick="continuePlay()">Continue Playing</button>
    <button id="filterEnable" class="button" onclick="changeFilterState()">Enable Filter</button>
    <button id="recordBtn" class="button" onclick="startRecording()">Record 10 Seconds</button>
    <a id="downloadLink" style="display:none">Download Recording</a>
    <button id="uploadBtn" class="button" style="display:none" onclick="uploadToCloud()">Upload to Cloud</button>
    
    <!-- BPM Display -->
    <div id="bpmDisplay">Heart Rate: -- BPM</div>
    
    <div id="graph"></div>
    <script>
        function addDarkmodeWidget() {
            new Darkmode().showWidget();
        }
        window.changeFilterState = function () {
            useFilter = !useFilter;
            const filterBtn = document.getElementById('filterEnable');

            if (useFilter) {
                filterBtn.textContent = "Disable Filter";
                filterBtn.classList.add('enabled');
                resetFilterState();
                console.log("Bandpass filter enabled (20-50Hz)");
            } else {
                filterBtn.textContent = "Enable Filter";
                filterBtn.classList.remove('enabled');
                console.log("Filter disabled - raw audio");
            }
        }
        window.addEventListener('load', addDarkmodeWidget);

        var connectBtn = document.getElementById("connectBtn");
        var pauseBtn = document.getElementById("pauseBtn");
        var continueBtn = document.getElementById("continueBtn");
        var recordBtn = document.getElementById("recordBtn");
        var downloadLink = document.getElementById("downloadLink");
        var uploadBtn = document.getElementById("uploadBtn");
        var filter = document.getElementById("filterEnable");
        var bpmDisplay = document.getElementById("bpmDisplay");
        
        // Recording variables
        let recordedChunks = [];
        let isRecording = false;
        let recordStartTime;
        const RECORD_DURATION = 10000; // 10 seconds
        let ws; // Make WebSocket connection global
        let useFilter = false; // Global flag for filter state
        let currentVolume = 1.0; // Default volume
        
        // Initialize button states
        connectBtn.disabled = false;
        pauseBtn.disabled = true;
        continueBtn.disabled = true;
        recordBtn.disabled = true;

        // BPM detection variables
        const heartRateDetector = {
            buffer: [], // Store recent samples for peak detection
            bufferSize: 16000, // 1 second of data at 16kHz
            peakThreshold: 250, // Adjustable threshold for peak detection
            peaks: [], // Timestamps of detected peaks
            lastPeakTime: 0,
            minTimeBetweenPeaks: 600, // Minimum ms between peaks (prevents multiple detections)
            bpm: 0,
            
            init: function() {
                this.buffer = new Array(this.bufferSize).fill(0);
                this.peaks = [];
                this.lastPeakTime = 0;
                this.bpm = 0;
            },
            
            addSamples: function(samples) {
                // Add new samples to buffer, removing oldest
                for (let i = 0; i < samples.length; i++) {
                    this.buffer.shift();
                    this.buffer.push(samples[i]);
                }
                
                this.detectPeaks();
                this.calculateBPM();
            },
            
            detectPeaks: function() {
                const currentTime = Date.now();
                // Only check for peaks if enough time has passed since last peak
                if (currentTime - this.lastPeakTime < this.minTimeBetweenPeaks) return;
                
                // Check the most recent 1/4 of the buffer for peaks
                const checkStartIdx = Math.floor(this.buffer.length * 0.75);
                
                // Find highest value in check window
                let max = 0;
                let maxIdx = 0;
                for (let i = checkStartIdx; i < this.buffer.length; i++) {
                    const absVal = Math.abs(this.buffer[i]);
                    if (absVal > max) {
                        max = absVal;
                        maxIdx = i;
                    }
                }
                
                // If max exceeds threshold and is local maximum, count as peak
                console.log(max);
                if (max > this.peakThreshold) {
                    // Check if it's a local maximum
                    const windowSize = 50; // Check 50 samples around the peak
                    let isLocalMax = true;
                    
                    for (let i = Math.max(checkStartIdx, maxIdx - windowSize); 
                         i < Math.min(this.buffer.length, maxIdx + windowSize); i++) {
                        if (i !== maxIdx && Math.abs(this.buffer[i]) > max) {
                            isLocalMax = false;
                            break;
                        }
                    }
                    
                    if (isLocalMax) {
                        this.peaks.push(currentTime);
                        this.lastPeakTime = currentTime;
                        
                        // Keep only last 10 peaks for BPM calculation
                        if (this.peaks.length > 10) {
                            this.peaks.shift();
                        }
                    }
                }
            },
            
            calculateBPM: function() {
                if (this.peaks.length < 2) return;
                
                // Calculate intervals between peaks
                const intervals = [];
                for (let i = 1; i < this.peaks.length; i++) {
                    intervals.push(this.peaks[i] - this.peaks[i - 1]);
                }
                
                // Remove outliers (intervals that differ too much from median)
                if (intervals.length > 3) {
                    intervals.sort((a, b) => a - b);
                    const median = intervals[Math.floor(intervals.length / 2)];
                    const validIntervals = intervals.filter(
                        interval => interval > median * 0.5 && interval < median * 1.5
                    );
                    
                    if (validIntervals.length > 0) {
                        const avgInterval = validIntervals.reduce((sum, val) => sum + val, 0) / validIntervals.length;
                        this.bpm = Math.round(60000 / avgInterval); // Convert to BPM (60000 ms / interval)
                        
                        // Reasonable BPM range check (40-200)
                        if (this.bpm >= 60 && this.bpm <= 120) {
                            bpmDisplay.textContent = `Heart Rate: ${this.bpm} BPM`;
                        }
                    }
                }
            },
            
            adjustThreshold: function(newThreshold) {
                this.peakThreshold = newThreshold;
            }
        };

        // Worker for graph processing
        var worker = new Worker('js/worker.js')
        worker.addEventListener('message', function (e) {
            graphDataArray = graphDataArray.concat(e.data)
            graphDataArray.splice(0, graphDataArray.length - arrayLength)

            var data_update = {
                y: [graphDataArray]
            };

            Plotly.update('graph', data_update)
        }, false);

        // Graph initialization
        const arrayLength = 500
        var graphDataArray = []

        for (var i = 0; i < arrayLength; i++) {
            graphDataArray[i] = 0;
        }

        var layout = {
            title: 'Streaming Data',
            paper_bgcolor: "#000",
            plot_bgcolor: "#000",
            xaxis: {
                domain: [-10, 10],
                showticklabels: false,
                color: "#FFF",
            },
            yaxis: {
                domain: [0, 1],
                color: "#FFF",
                range: [-30, 30], // Fixed range for 16-bit audio
                fixedrange: true // Prevents zoom/pan
            }
        };

        Plotly.newPlot('graph', [{
            y: graphDataArray,
            mode: 'lines',
            line: { color: '#DF56F1' }
        }], layout);

        // Audio player instance
        let player;

        // Recording functions
        function startRecording() {
            if (isRecording) return;

            recordedChunks = [];
            isRecording = true;
            recordStartTime = Date.now();
            recordBtn.disabled = true;
            recordBtn.textContent = "Recording... (0%)";

            console.log("Recording started...");

            // Update progress every second
            const progressInterval = setInterval(() => {
                if (!isRecording) {
                    clearInterval(progressInterval);
                    return;
                }
                const elapsed = Date.now() - recordStartTime;
                const percent = Math.min(100, Math.round((elapsed / RECORD_DURATION) * 100));
                recordBtn.textContent = `Recording... (${percent}%)`;
            }, 200);

            // Auto-stop timer
            setTimeout(stopRecording, RECORD_DURATION);
        }

        function stopRecording() {
            if (!isRecording) return;

            isRecording = false;
            recordBtn.disabled = false;
            recordBtn.textContent = "Record 10 Seconds";

            if (recordedChunks.length === 0) {
                console.warn("No audio data recorded");
                return;
            }

            // Create WAV file
            const wavBlob = createWavBlob(recordedChunks, 1, 16000);
            const audioUrl = URL.createObjectURL(wavBlob);

            // Set up download
            downloadLink.href = audioUrl;
            downloadLink.download = `recording_${new Date().toISOString().replace(/[:.]/g, '-')}.wav`;
            downloadLink.style.display = 'inline-block';

            // Enable upload
            uploadBtn.style.display = 'inline-block';

            console.log(`Recording complete! Saved ${recordedChunks.length} chunks (${wavBlob.size} bytes)`);
        }

        function createWavBlob(chunks, channels, sampleRate) {
            // Calculate total bytes (2 bytes per sample for Int16)
            const totalBytes = chunks.reduce((sum, chunk) => sum + chunk.byteLength, 0);

            // Create WAV header
            const header = new ArrayBuffer(44);
            const view = new DataView(header);

            /* RIFF identifier */
            writeString(view, 0, 'RIFF');
            /* RIFF chunk length */
            view.setUint32(4, 36 + totalBytes, true);
            /* RIFF type */
            writeString(view, 8, 'WAVE');
            /* Format chunk identifier */
            writeString(view, 12, 'fmt ');
            /* Format chunk length */
            view.setUint32(16, 16, true);
            /* Sample format (raw) */
            view.setUint16(20, 1, true);
            /* Channel count */
            view.setUint16(22, channels, true);
            /* Sample rate */
            view.setUint32(24, sampleRate, true);
            /* Byte rate (sample rate * block align) */
            view.setUint32(28, sampleRate * channels * 2, true);
            /* Block align (channel count * bytes per sample) */
            view.setUint16(32, channels * 2, true);
            /* Bits per sample */
            view.setUint16(34, 16, true);
            /* Data chunk identifier */
            writeString(view, 36, 'data');
            /* Data chunk length */
            view.setUint32(40, totalBytes, true);

            // Combine header and audio data
            const merged = new Uint8Array(44 + totalBytes);
            merged.set(new Uint8Array(header), 0);

            let offset = 44;
            chunks.forEach(chunk => {
                merged.set(new Uint8Array(chunk), offset);
                offset += chunk.byteLength;
            });

            return new Blob([merged], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        async function uploadToCloud() {
            const wavBlob = createWavBlob(recordedChunks, 1, 16000);
            uploadBtn.disabled = true;
            uploadBtn.textContent = "Uploading...";


            const firebaseConfig = {
                apiKey: "AIzaSyBt5XCrUZd2QnO0No4aoUcTkLsTw3zPl2A",
                authDomain: "remote-stethoscope.firebaseapp.com",
                projectId: "remote-stethoscope",
                storageBucket: "remote-stethoscope.firebasestorage.app",
                messagingSenderId: "278785615905",
                appId: "1:278785615905:web:3e0fdd05539af815335b60",
                measurementId: "G-5G99972VC9"
            };

            // Initialize Firebase (only once)
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }

            try {
                // 1. Upload .wav to Firebase Storage
                const filename = `recording_${Date.now()}.wav`;
                const storageRef = firebase.storage().ref(`recordings/${filename}`);
                await storageRef.put(wavBlob);

                // 2. Save metadata to Firestore
                const downloadURL = await storageRef.getDownloadURL();
                await firebase.firestore().collection("recordings").add({
                    filename,
                    downloadURL,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    duration: 10,
                    size: wavBlob.size,
                    heartRate: heartRateDetector.bpm || null // Include heart rate with recording
                });

                uploadBtn.textContent = "Uploaded!";
            } catch (error) {
                console.error("Upload failed:", error);
                uploadBtn.textContent = "Upload Failed";
            } finally {
                setTimeout(() => {
                    uploadBtn.textContent = "Upload to Cloud";
                    uploadBtn.disabled = false;
                }, 2000);
            }
        }
        const filterSettings = {
            lowCutoff: 20,
            highCutoff: 50,
            sampleRate: 16000
        };
        class HeartSoundFilter {
            constructor() {
                this.reset();
                this.calculateCoefficients();
            }

            reset() {
                this.x1 = 0; this.x2 = 0;
                this.y1 = 0; this.y2 = 0;
            }

            calculateCoefficients() {
                const { lowCutoff, highCutoff, sampleRate } = filterSettings;
                const nyquist = sampleRate / 2;
                const low = lowCutoff / nyquist;
                const high = highCutoff / nyquist;
                const omega = Math.PI * (high + low);
                const bandwidth = Math.PI * (high - low);
                const alpha = Math.sin(bandwidth) / (2 * Math.SQRT2);
                const cos_omega = Math.cos(omega);

                const b0 = alpha;
                const b1 = 0;
                const b2 = -alpha;
                const a0 = 1 + alpha;
                const a1 = -2 * cos_omega;
                const a2 = 1 - alpha;

                this.b0 = b0 / a0;
                this.b1 = b1 / a0;
                this.b2 = b2 / a0;
                this.a0 = 1;
                this.a1 = a1 / a0;
                this.a2 = a2 / a0;
            }

            processSample(input) {
                const output = this.b0 * input +
                    this.b1 * this.x1 +
                    this.b2 * this.x2 -
                    this.a1 * this.y1 -
                    this.a2 * this.y2;

                this.x2 = this.x1;
                this.x1 = input;
                this.y2 = this.y1;
                this.y1 = output;

                return Math.max(-32768, Math.min(32767, output));
            }

            processBuffer(inputArray) {
                const output = new Int16Array(inputArray.length);
                for (let i = 0; i < inputArray.length; i++) {
                    output[i] = this.processSample(inputArray[i]);
                }
                return output;
            }
        }
        const heartSoundFilter = new HeartSoundFilter();
        function resetFilterState() {
            heartSoundFilter.reset();
        }

        function applyBandpassFilter(inputArray) {
            // Convert ArrayBuffer to Int16Array if needed
            const data = inputArray instanceof ArrayBuffer ? new Int16Array(inputArray) : inputArray;
            return heartSoundFilter.processBuffer(data);
        }
        function applyVolume(inputArray, volume) {
            const output = new Int16Array(inputArray.length);
            const rampSamples = Math.min(100, inputArray.length);

            for (let i = 0; i < inputArray.length; i++) {
                const rampFactor = i < rampSamples ? (i / rampSamples) :
                    i > inputArray.length - rampSamples ?
                        ((inputArray.length - i) / rampSamples) : 1;

                output[i] = Math.min(32767, Math.max(-32768,
                    Math.round(inputArray[i] * volume * rampFactor)));
            }

            return output;
        }
        // WebSocket connection
        window.connect = function connect() {
            connectBtn.disabled = true;
            pauseBtn.disabled = false;
            recordBtn.disabled = false;

            player = new PCMPlayer({
                inputCodec: 'Int16',
                channels: 1,
                sampleRate: 16000,
                flushTime: 200,
            });

            // Initialize BPM detector
            heartRateDetector.init();

            const WS_URL = 'ws://192.168.187.90:8080';
            ws = new WebSocket(WS_URL);
            ws.binaryType = 'arraybuffer';

            ws.addEventListener('message', function (event) {
                if (continueBtn.disabled) {
                    const int16Data = new Int16Array(event.data);
                    const processedData = useFilter ? applyBandpassFilter(int16Data) : int16Data;
                    let volumeApplied = applyVolume(processedData, currentVolume).buffer;
                    
                    // Process audio for BPM detection
                    heartRateDetector.addSamples(processedData);
                    
                    player.feed(processedData);
                    worker.postMessage(processedData);

                    // If recording, store the data
                    if (isRecording) {
                        recordedChunks.push(volumeApplied);
                    }
                }
            });

            ws.onerror = function (error) {
                console.error("WebSocket Error:", error);
                alert("Connection failed! Check console for details.");
                connectBtn.disabled = false;
                pauseBtn.disabled = true;
                recordBtn.disabled = true;
            };
        }

        window.changeVolume = function changeVolume(e) {
            currentVolume = document.querySelector('#range').value;
            player.volume(currentVolume);
        }

        window.pause = async function pause() {
            pauseBtn.disabled = true;
            continueBtn.disabled = false;
            await player.pause();
        }

        window.continuePlay = function continuePlay() {
            player.continue();
            pauseBtn.disabled = false;
            continueBtn.disabled = true;
        }
    </script>
</body>
