<!DOCTYPE html>
<html>

<head>
    <title>Stethoscope Audio Processor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet' type='text/css'>
    <link href="css/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/darkmode-js@1.5.7/lib/darkmode-js.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pcm-player@0.0.18/dist/index.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>
</head>

<body>
    <h1>Stethoscope Audio Processor</h1>
    <div class="controls">
        <button id="connectBtn" class="button" onclick="connect()">Connect</button>
        <button id="pauseBtn" class="button" disabled onclick="pause()">Pause</button>
        <button id="continueBtn" class="button" disabled onclick="continuePlay()">Continue</button>
        <div style="margin-top: 15px;">
            <label for="range">Volume: </label>
            <input type="range" id="range" min="0.1" max="100" value="1" step="0.1" oninput="changeVolume(event)">
            <span id="volumeLabel">1.0x</span>
        </div>
        <div class="toggle-container">
            <label class="toggle-switch">
                <input type="checkbox" id="filterToggle" checked>
                <span class="toggle-slider"></span>
            </label>
            <span id="filterStatus">Filtered Audio</span>
        </div>
        <div style="margin-top: 15px;">
            <button id="recordBtn" class="button" disabled onclick="startRecording()">Record 10 Seconds</button>
            <a id="downloadLink" class="button" style="display:none; background-color: #2196F3;">Download Recording</a>
            <button id="uploadBtn" class="button" style="display:none" onclick="uploadToCloud()">Upload to
                Cloud</button>
        </div>

    </div>
    <div id="status" class="status"></div>
    <div id="graph"></div>

    <script src="js/graph.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/recording.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
