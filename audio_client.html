<!DOCTYPE html>
<html>
<head>
    <title>Stethoscope Audio Processor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet'>
    <link href="css/styles.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/darkmode-js@1.5.7/lib/darkmode-js.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pcm-player@0.0.18/dist/index.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>
</head>
<body>
    <h1>Stethoscope Audio Processor</h1>
    <div class="controls">
        <button id="connectBtn" class="button">Connect</button>
        <button id="pauseBtn" class="button" disabled>Pause</button>
        <button id="continueBtn" class="button" disabled>Continue</button>
        
        <div class="control-group">
            <label for="range">Volume: </label>
            <input type="range" id="range" min="0.1" max="5" value="1" step="0.1">
            <span id="volumeLabel">1.0x</span>
        </div>
        
        <div class="toggle-container">
            <label class="toggle-switch">
                <input type="checkbox" id="filterToggle" checked>
                <span class="toggle-slider"></span>
            </label>
            <span id="filterStatus">Filtered Audio</span>
        </div>
        
        <div class="enhancement-controls">
            <h3>Audio Enhancements</h3>
            <div class="toggle-container">
                <label class="toggle-switch">
                    <input type="checkbox" id="noiseReductionToggle" checked>
                    <span class="toggle-slider"></span>
                </label>
                <span>Noise Reduction</span>
            </div>
            
            <div class="toggle-container">
                <label class="toggle-switch">
                    <input type="checkbox" id="harmonicBoostToggle">
                    <span class="toggle-slider"></span>
                </label>
                <span>Harmonic Boost</span>
            </div>
            
            <div class="toggle-container">
                <label class="toggle-switch">
                    <input type="checkbox" id="beatDetectionToggle">
                    <span class="toggle-slider"></span>
                </label>
                <span>Beat Detection</span>
            </div>
            
            <div class="control-group">
                <label for="harmonicGain">Harmonic Strength: </label>
                <input type="range" id="harmonicGain" min="1" max="2" step="0.1" value="1.3">
            </div>
        </div>
        
        <div class="recording-controls">
            <button id="recordBtn" class="button" disabled>Record 10 Seconds</button>
            <a id="downloadLink" class="button" style="display:none; background-color: #2196F3;">Download</a>
            <button id="uploadBtn" class="button" style="display:none">Upload to Cloud</button>
        </div>
    </div>
    
    <div id="status" class="status"></div>
    <div id="graph"></div>

    <!-- Load JavaScript files -->
    <script src="js/audio-processors.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/graph.js"></script>
    <script src="js/recording.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
