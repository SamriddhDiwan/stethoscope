<html>

<head>
    <title>PCM Player</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href='http://fonts.googleapis.com/css?family=Roboto' rel='stylesheet' type='text/css'>
    <link rel="icon" href="image/favicon.ico" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/darkmode-js@1.5.7/lib/darkmode-js.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js" charset="utf-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/pcm-player@0.0.18/dist/index.js"></script>
    <script type="js/worker.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
</head>
<style>
    body {
        font-family: 'Roboto', sans-serif;
    }

    .button {
        border: none;
        padding: 15px 32px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
    }
</style>

<body>
    <h1>Stethoscope Client</h1>
    <p>Connect to WebSocket by pressing the [Connect] button first!</p>
    <button id="connectBtn" class="button" onclick="connect()">Connect</button>
    <input type="range" max="5" value="1" min="0" id="range" onchange="changeVolume(event)" step="0.1">
    <button id="pauseBtn" class="button" onclick="pause()">Pause Playing</button>
    <button id="continueBtn" class="button" onclick="continuePlay()">Continue Playing</button>
    <button id="recordBtn" class="button" onclick="startRecording()">Record 10 Seconds</button>
    <a id="downloadLink" style="display:none">Download Recording</a>
    <button id="uploadBtn" class="button" style="display:none" onclick="uploadToCloud()">Upload to Cloud</button>
    <div id="graph"></div>
    <script>

        function addDarkmodeWidget() {
            new Darkmode().showWidget();
        }
        window.addEventListener('load', addDarkmodeWidget);

        var connectBtn = document.getElementById("connectBtn");
        var pauseBtn = document.getElementById("pauseBtn");
        var continueBtn = document.getElementById("continueBtn");
        var recordBtn = document.getElementById("recordBtn");
        var downloadLink = document.getElementById("downloadLink");
        var uploadBtn = document.getElementById("uploadBtn");

        // Recording variables
        let recordedChunks = [];
        let isRecording = false;
        let recordStartTime;
        const RECORD_DURATION = 10000; // 10 seconds
        let ws; // Make WebSocket connection global

        // Initialize button states
        connectBtn.disabled = false;
        pauseBtn.disabled = true;
        continueBtn.disabled = true;
        recordBtn.disabled = true;

        // Worker for graph processing
        var worker = new Worker('js/worker.js')
        worker.addEventListener('message', function (e) {
            graphDataArray = graphDataArray.concat(e.data)
            graphDataArray.splice(0, 1)

            var data_update = {
                y: [graphDataArray]
            };

            Plotly.update('graph', data_update)
        }, false);

        // Graph initialization
        const arrayLength = 100
        var graphDataArray = []

        for (var i = 0; i < arrayLength; i++) {
            graphDataArray[i] = 0;
        }

        var layout = {
            title: 'Streaming Data',
            paper_bgcolor: "#000",
            plot_bgcolor: "#000",
            xaxis: {
                domain: [0, 1],
                showticklabels: false,
                color: "#FFF",
            },
            yaxis: {
                domain: [0, 1],
                color: "#FFF",
                rangemode: "auto",
            },
        }

        Plotly.newPlot('graph', [{
            y: graphDataArray,
            mode: 'lines',
            line: { color: '#DF56F1' }
        }], layout);

        // Audio player instance
        let player;

        // Recording functions
        function startRecording() {
            if (isRecording) return;

            recordedChunks = [];
            isRecording = true;
            recordStartTime = Date.now();
            recordBtn.disabled = true;
            recordBtn.textContent = "Recording... (0%)";

            console.log("Recording started...");

            // Update progress every second
            const progressInterval = setInterval(() => {
                if (!isRecording) {
                    clearInterval(progressInterval);
                    return;
                }
                const elapsed = Date.now() - recordStartTime;
                const percent = Math.min(100, Math.round((elapsed / RECORD_DURATION) * 100));
                recordBtn.textContent = `Recording... (${percent}%)`;
            }, 200);

            // Auto-stop timer
            setTimeout(stopRecording, RECORD_DURATION);
        }

        function stopRecording() {
            if (!isRecording) return;

            isRecording = false;
            recordBtn.disabled = false;
            recordBtn.textContent = "Record 10 Seconds";

            if (recordedChunks.length === 0) {
                console.warn("No audio data recorded");
                return;
            }

            // Create WAV file
            const wavBlob = createWavBlob(recordedChunks, 1, 16000);
            const audioUrl = URL.createObjectURL(wavBlob);

            // Set up download
            downloadLink.href = audioUrl;
            downloadLink.download = `recording_${new Date().toISOString().replace(/[:.]/g, '-')}.wav`;
            downloadLink.style.display = 'inline-block';

            // Enable upload
            uploadBtn.style.display = 'inline-block';

            console.log(`Recording complete! Saved ${recordedChunks.length} chunks (${wavBlob.size} bytes)`);
        }

        function createWavBlob(chunks, channels, sampleRate) {
            // Calculate total bytes (2 bytes per sample for Int16)
            const totalBytes = chunks.reduce((sum, chunk) => sum + chunk.byteLength, 0);

            // Create WAV header
            const header = new ArrayBuffer(44);
            const view = new DataView(header);

            /* RIFF identifier */
            writeString(view, 0, 'RIFF');
            /* RIFF chunk length */
            view.setUint32(4, 36 + totalBytes, true);
            /* RIFF type */
            writeString(view, 8, 'WAVE');
            /* Format chunk identifier */
            writeString(view, 12, 'fmt ');
            /* Format chunk length */
            view.setUint32(16, 16, true);
            /* Sample format (raw) */
            view.setUint16(20, 1, true);
            /* Channel count */
            view.setUint16(22, channels, true);
            /* Sample rate */
            view.setUint32(24, sampleRate, true);
            /* Byte rate (sample rate * block align) */
            view.setUint32(28, sampleRate * channels * 2, true);
            /* Block align (channel count * bytes per sample) */
            view.setUint16(32, channels * 2, true);
            /* Bits per sample */
            view.setUint16(34, 16, true);
            /* Data chunk identifier */
            writeString(view, 36, 'data');
            /* Data chunk length */
            view.setUint32(40, totalBytes, true);

            // Combine header and audio data
            const merged = new Uint8Array(44 + totalBytes);
            merged.set(new Uint8Array(header), 0);

            let offset = 44;
            chunks.forEach(chunk => {
                merged.set(new Uint8Array(chunk), offset);
                offset += chunk.byteLength;
            });

            return new Blob([merged], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        async function uploadToCloud() {
            const wavBlob = createWavBlob(recordedChunks, 1, 16000);
            uploadBtn.disabled = true;
            uploadBtn.textContent = "Uploading...";


            const firebaseConfig = {
                apiKey: "AIzaSyCwCpMKurK0NpmWbpbV1rgTbY7gYM735Rs",
                authDomain: "remote-stethoscope.firebaseapp.com",
                projectId: "remote-stethoscope",
                storageBucket: "remote-stethoscope.firebasestorage.app",
                messagingSenderId: "278785615905",
                appId: "1:278785615905:web:3e0fdd05539af815335b60",
                measurementId: "G-5G99972VC9"
            };

            // Initialize Firebase (only once)
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }

            try {
                // 1. Upload .wav to Firebase Storage
                const filename = `recording_${Date.now()}.wav`;
                const storageRef = firebase.storage().ref(`recordings/${filename}`);
                await storageRef.put(wavBlob);

                // 2. Save metadata to Firestore
                const downloadURL = await storageRef.getDownloadURL();
                await firebase.firestore().collection("recordings").add({
                    filename,
                    downloadURL,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    duration: 10,
                    size: wavBlob.size
                });

                uploadBtn.textContent = "Uploaded!";
            } catch (error) {
                console.error("Upload failed:", error);
                uploadBtn.textContent = "Upload Failed";
            } finally {
                setTimeout(() => {
                    uploadBtn.textContent = "Upload to Cloud";
                    uploadBtn.disabled = false;
                }, 2000);
            }
        }

        // WebSocket connection
        window.connect = function connect() {
            connectBtn.disabled = true;
            pauseBtn.disabled = false;
            recordBtn.disabled = false;

            player = new PCMPlayer({
                inputCodec: 'Int16',
                channels: 1,
                sampleRate: 16000,
            });

            const WS_URL = 'ws://192.168.187.139:8080';
            ws = new WebSocket(WS_URL);
            ws.binaryType = 'arraybuffer';

            ws.addEventListener('message', function (event) {
                if (continueBtn.disabled) {
                    player.feed(event.data);
                    worker.postMessage(event.data);

                    // If recording, store the data
                    if (isRecording) {
                        recordedChunks.push(event.data);
                    }
                }
            });

            ws.onerror = function (error) {
                console.error("WebSocket Error:", error);
                alert("Connection failed! Check console for details.");
                connectBtn.disabled = false;
                pauseBtn.disabled = true;
                recordBtn.disabled = true;
            };
        }

        window.changeVolume = function changeVolume(e) {
            player.volume(document.querySelector('#range').value);
        }

        window.pause = async function pause() {
            pauseBtn.disabled = true;
            continueBtn.disabled = false;
            await player.pause();
        }

        window.continuePlay = function continuePlay() {
            player.continue();
            pauseBtn.disabled = false;
            continueBtn.disabled = true;
        }
    </script>
</body>

</html>
